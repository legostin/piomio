# The checks a change passes before it ships: the types (npm run typecheck) and the tests (npm test).
# Pull requests and pushes to other branches run them here (a version PR's branch, pushed by Actions, has them
# dispatched). On main nothing is released untested: release-on-push.yml runs them before it opens the version PR and
# again on its merge before the tag, and release.yml runs them on the version tag before it publishes the installers.
name: checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  # release-on-push.yml and release.yml wait for these checks.
  workflow_call:

permissions:
  contents: read

jobs:
  panel-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Capture panels before the change
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="${PR_BASE:-$(git rev-parse HEAD^)}"
          git restore --source="$baseline" -- packages/web/src
          PANEL_BASELINE=1 npx playwright test --config packages/web/e2e/playwright.config.ts
          git restore --source=HEAD -- packages/web/src
      - name: Check panel safe areas and capture the result
        run: npx playwright test --config packages/web/e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-layout
          path: output/playwright/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The browser plugin's tests drive Playwright's Chromium, with the system libraries it needs.
      - run: npx playwright install --with-deps chromium
      - run: npm test

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE: /piomio/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:ui-plugins
      - run: npm run build:site
      - run: npm run check:site
