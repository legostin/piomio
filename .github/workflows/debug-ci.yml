name: debug-ci
on:
  push:
    branches: [fix/ci-main-previews-site]
permissions:
  contents: read
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci >/dev/null 2>&1
      - name: vitest debug test
        run: npx vitest run packages/core/test/dbg-previews.test.ts 2>&1 | grep DBG || true
  site:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /
      SITE_ORIGIN: https://piomio.io
      SITE_CNAME: piomio.io
      GA_MEASUREMENT_ID: G-RCPYYNZ3CQ
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci >/dev/null 2>&1
      - run: npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: npm run build:ui-plugins >/dev/null 2>&1
      - run: npm run build:site >/dev/null 2>&1
      - name: check site
        run: npm run check:site > $RUNNER_TEMP/site.log 2>&1 || true
      - run: tail -c 9000 $RUNNER_TEMP/site.log
