name: debug-ci
on:
  push:
    branches: [fix/ci-main-previews-site]
permissions:
  contents: read
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci >/dev/null 2>&1
      - name: vitest debug test
        run: npx vitest run packages/core/test/dbg-previews.test.ts 2>&1 | grep -v '^$' | tail -40 || true
