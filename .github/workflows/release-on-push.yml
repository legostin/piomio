# Checks the exact main event commit, reserves a version tag, then explicitly dispatches release-tags.yml.
# GITHUB_TOKEN tag creation cannot trigger the tag-push workflow. No job writes to main.
name: release on push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest stable tag goes up (archive docs in a PR before minor/major)
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Plan only, without creating a tag or dispatching a release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  plan:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dry-run the release policy
        env:
          BEFORE: ${{ github.event.before }}
          BUMP: ${{ inputs.bump || 'patch' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/release-on-push.mjs

  tag:
    needs: [checks, plan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    concurrency:
      group: release-tags
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # Refresh tags inside the serialized job, but never change the commit that passed checks.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create the tag and dispatch its build
        env:
          BEFORE: ${{ github.event.before }}
          BUMP: ${{ inputs.bump || 'patch' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-on-push.mjs --publish
