# A push to main that changes what ships becomes a release once its checks pass (checks.yml: the types and the tests).
# main takes writes only from its owner (the repository ruleset), so Actions never commits to it: the version-pr job
# (scripts/version-pr.mjs) raises the patch version (the root package.json and package-lock.json's two root versions)
# on top of main on the branch release/X.Y.Z, opens the PR "Piomio X.Y.Z" with only that change and starts its checks.
# The owner merges it; that push's prepared-release job (scripts/prepared-release.mjs) tags the merge vX.Y.Z and
# starts release.yml, which publishes the installers. A push whose checks fail opens no PR. Pushes that ship while the
# PR is open rebuild it on top of them, so they make one release.
# [skip release] in ANY commit of a push defers that whole push; checks still run. The next unmarked push
# compares with the current version tag, so deferred code goes into the next release. Do not use [skip ci].
# What doesn't ship releases nothing: the site, the docs, Markdown at the root, tests and test helpers, and the
# workflows and scripts that build none of it (see scripts/release-on-push.mjs). Neither does a push that raised the
# version itself (a version PR's merge). Run this workflow by hand for a minor or major version PR.
# The docs (docs/guide) describe the newest release line; a minor or major version PR also freezes them for the line
# before it into docs/versions/<major.minor> (asked for by hand, it releases main as the last patch release left it,
# so the docs are that line's last ones). The site rebuilds after the release (site.yml) and names the new version.
name: release on push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All push commits for [skip release], and the last release tag for accumulated changes.
          fetch-depth: 0
      - name: Does this push change what ships?
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/release-on-push.mjs

  # Every push to main is checked, whether it releases or not.
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  # A version PR's merge (version-pr below opens it): only a tag and a build dispatch, never a write to main.
  prepared-release:
    needs: [check, checks]
    if: github.event_name == 'push' && needs.check.outputs.release == 'false' && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: prepared-release
      cancel-in-progress: false
    permissions:
      contents: write # Create the version tag; never update main or an existing tag.
      actions: write # GITHUB_TOKEN's tag push cannot trigger release.yml: dispatch it explicitly.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag the prepared version and start its build
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepared-release.mjs

  # main takes writes only from its owner (the repository ruleset): the new version comes as a PR the owner merges, and
  # prepared-release above tags that merge.
  version-pr:
    needs: [check, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.check.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
    permissions:
      contents: write # Push the release/X.Y.Z branch; the ruleset keeps main itself to its owner.
      pull-requests: write # Open, update and close version PRs (the repository lets Actions create PRs).
      actions: write # A branch pushed with the workflow token starts no checks by itself: dispatch them.
    steps:
      # This run's own release tooling; the version goes on top of main as it is when the job starts.
      - uses: actions/checkout@v7
        with:
          path: tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
          # The history and the tags, to tell whether the current version already holds this push.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The checks take minutes: a later push whose checks finished first may have proposed this one already, and a
      # version PR merged meanwhile holds it.
      - name: Open or update the version PR
        working-directory: main
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: node ../tools/scripts/version-pr.mjs
