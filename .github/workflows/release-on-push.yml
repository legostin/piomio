# A push to main that changes what ships releases a new version by itself: the patch version goes up (the root
# package.json and package-lock.json's two root versions), the commit "Piomio X.Y.Z" lands on main with the tag vX.Y.Z,
# and release.yml publishes the installers and the server image.
# What doesn't ship releases nothing: the site, the docs, Markdown at the root, tests and test helpers, and the
# workflows that build none of it (see ships() below). Neither does a push that raised the version itself (a release
# made by hand). Run this workflow by hand to release a minor or major version.
# Pushes close together make one release: a newer one waiting replaces an older one, and each release takes main as it
# is when it starts.
name: release on push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - name: Does this push change what ships?
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          release() { echo "release=$1" >>"$GITHUB_OUTPUT"; }
          v=$(node -p "require('./package.json').version")
          # The commits the tag v<version> names (lightweight, or annotated and peeled).
          tagged=$(git ls-remote --tags origin | awk -v t="refs/tags/v$v" '$2 == t || $2 == t "^{}" { print $1 }')
          if [ -z "$tagged" ] || echo "$tagged" | grep -qx "$GITHUB_SHA"; then
            echo "v$v is this push's own release"
            release false; exit 0
          fi
          ships() {
            case "$1" in
              packages/site/*|packages/testkit/*|docs/*) return 1 ;;
              .github/workflows/site.yml|.github/workflows/release-on-push.yml) return 1 ;;
              .github/workflows/*) return 0 ;;
              .github/*|*/test/*|*.test.ts|*.test.tsx) return 1 ;;
              */*) return 0 ;;
              *.md|LICENSE) return 1 ;;
              *) return 0 ;;
            esac
          }
          # Without the commit before the push (a new branch, a history rewritten away) every file counts.
          if ! git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
            echo "no $BEFORE to compare with"
            release true; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          while IFS= read -r f; do
            if [ -n "$f" ] && ships "$f"; then
              echo "ships: $f"
              release true; exit 0
            fi
          done <<<"$files"
          echo "nothing that ships changed:"
          echo "$files"
          release false

  release:
    needs: check
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Raise the version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          v=$(node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const [major, minor, patch] = JSON.parse(readFileSync("package.json", "utf8")).version.split(".").map(Number);
            const v = { major: `${major + 1}.0.0`, minor: `${major}.${minor + 1}.0`, patch: `${major}.${minor}.${patch + 1}` }[process.env.BUMP];
            for (const file of ["package.json", "package-lock.json"]) {
              const json = JSON.parse(readFileSync(file, "utf8"));
              json.version = v;
              if (json.packages?.[""]) json.packages[""].version = v;
              writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
            console.log(v);
          ')
          git diff
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - name: Commit, tag and start the release
        env:
          V: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Piomio $V"
          # A push that lands on main meanwhile goes under the version commit and gets its own run after this one.
          for try in 1 2 3; do
            git tag -f "v$V"
            git push --atomic origin HEAD:main "v$V" && break
            [ "$try" = 3 ] && exit 1
            git fetch -q origin main
            git rebase origin/main
          done
          # A tag pushed with the workflow token starts no workflow by itself.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$V"
