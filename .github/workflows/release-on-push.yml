# A push to main that changes what ships releases a new version by itself once its checks pass (checks.yml: the types
# and the tests): the patch version goes up (the root package.json and package-lock.json's two root versions), the
# commit "Piomio X.Y.Z" lands on main with the tag vX.Y.Z, and release.yml publishes the installers.
# A push whose checks fail releases nothing.
# [skip release] in ANY commit of a push defers that whole push; checks still run. The next unmarked push
# compares with the current version tag, so deferred code goes into the next release. Do not use [skip ci].
# What doesn't ship releases nothing: the site, the docs, Markdown at the root, tests and test helpers, and the
# workflows that build none of it (see scripts/release-on-push.mjs). Neither does a push that raised the version itself (a release
# made by hand). Run this workflow by hand to release a minor or major version.
# Pushes close together make one release: a newer one waiting replaces an older one, and each release takes main as it
# is when it starts.
# The docs (docs/guide) describe the newest release line; a minor or major release freezes them for the line before it
# into docs/versions/<major.minor>, in the same commit (made by hand, it releases main as the last patch release left
# it, so the docs are that line's last ones). The site rebuilds after the release (site.yml) and names the new version.
name: release on push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All push commits for [skip release], and the last release tag for accumulated changes.
          fetch-depth: 0
      - name: Does this push change what ships?
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/release-on-push.mjs

  # Every push to main is checked, whether it releases or not.
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  release:
    needs: [check, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.check.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # The history and the tags, to tell whether the current version already holds this push.
          fetch-depth: 0
      # The checks take minutes: a later push whose checks finished first may have released this one already.
      - name: Not released yet?
        id: due
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = push ] && git merge-base --is-ancestor "$GITHUB_SHA" "v$v" 2>/dev/null; then
            echo "v$v already holds $GITHUB_SHA"
            echo "due=false" >>"$GITHUB_OUTPUT"
          else
            echo "due=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Raise the version
        if: steps.due.outputs.due == 'true'
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          old=$(node -p "require('./package.json').version")
          v=$(node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const [major, minor, patch] = JSON.parse(readFileSync("package.json", "utf8")).version.split(".").map(Number);
            const v = { major: `${major + 1}.0.0`, minor: `${major}.${minor + 1}.0`, patch: `${major}.${minor}.${patch + 1}` }[process.env.BUMP];
            for (const file of ["package.json", "package-lock.json"]) {
              const json = JSON.parse(readFileSync(file, "utf8"));
              json.version = v;
              if (json.packages?.[""]) json.packages[""].version = v;
              writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
            console.log(v);
          ')
          # A new line: the docs of the one before stay on the site as they are now (docs/guide/README.md).
          line() { echo "$1" | cut -d. -f1,2; }
          if [ "$(line "$old")" != "$(line "$v")" ] && [ -f docs/guide/nav.json ]; then
            dir="docs/versions/$(line "$old")"
            rm -rf "$dir" && mkdir -p "$dir"
            cp -R docs/guide/. "$dir/" && rm -f "$dir/README.md"
            printf '{ "release": "%s" }\n' "$old" >"$dir/release.json"
            git add "$dir"
          fi
          git diff HEAD --stat
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - name: Commit, tag and start the release
        if: steps.due.outputs.due == 'true'
        env:
          V: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Piomio $V"
          # A push that lands on main meanwhile goes under the version commit and gets its own run after this one.
          for try in 1 2 3; do
            git tag -f "v$V"
            git push --atomic origin HEAD:main "v$V" && break
            [ "$try" = 3 ] && exit 1
            git fetch -q origin main
            git rebase origin/main
          done
          # A tag pushed with the workflow token starts no workflow by itself.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$V"
