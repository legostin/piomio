# Builds the desktop app and its installers, and the Linux server archives, and checks them on clean runners: install,
# the hub answers, quit or uninstall, the data stays. release.yml calls it on a version tag and publishes what it built.
name: desktop app

on:
  workflow_dispatch:
  # release.yml builds the installers it publishes with this workflow.
  workflow_call:
  push:
    branches: [main]
    paths: ["packaging/**", "packages/desktop/**", "packages/tailnet/**", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["packaging/**", "packages/desktop/**", "packages/tailnet/**", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The hub's Tailscale node (packages/tailnet) is Go; staging builds it for the installer's architectures.
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tailnet/go.mod
          cache-dependency-path: packages/tailnet/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - run: npm ci
      - run: npm run build:ui -w @piomio/desktop
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml
      # The update files are signed with the project's key; without the secret (a fork's PR) they are left out.
      - run: npm run package:desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Install, start, check, quit, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem dist/desktop/piomio-setup-*-x64.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList "/S", "/NOSTART" -PassThru
          $p.WaitForExit(600000) | Out-Null
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Piomio"
          if (-not (Test-Path "$app\Piomio.exe")) { throw "Piomio.exe is missing" }
          if (-not (Test-Path "$app\app\packaging\desktop\launch.mjs")) { throw "the hub is missing" }

          Start-Process "$app\Piomio.exe" -ArgumentList "--mode", "hub", "--background"
          $state = $null
          for ($i = 0; $i -lt 120 -and -not $state; $i++) {
            try { $state = Invoke-RestMethod http://127.0.0.1:41780/api/auth/state } catch { Start-Sleep 1 }
          }
          if (-not $state) { Get-Content "$app\logs\*.log" -ErrorAction SilentlyContinue; throw "the hub did not answer" }
          if ($state.hasPassword) { throw "a fresh hub has a password" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Piomio"
          if ($run -ne "`"$app\Piomio.exe`" --background") { throw "Run value: $run" }

          Start-Process "$app\Piomio.exe" -ArgumentList "--quit" -Wait
          $down = $false
          for ($i = 0; $i -lt 30 -and -not $down; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:41780/api/auth/state | Out-Null; Start-Sleep 1 } catch { $down = $true }
          }
          if (-not $down) { throw "the hub still answers after --quit" }

          Start-Process "$app\uninstall.exe" -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\Piomio.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\Piomio.exe") { throw "not uninstalled" }
          if (-not (Test-Path "$app\piomio.db")) { throw "the data is gone" }
          $left = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue)."Piomio"
          if ($left) { throw "the Run value is still there" }
          "ok"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            dist/desktop/piomio-setup-*.exe
            dist/desktop/piomio-setup-*.exe.sig
          if-no-files-found: ignore

  linux:
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tailnet/go.mod
          cache-dependency-path: packages/tailnet/go.sum
      - run: npm ci
      # Signed with the project's update key, which hubs check before they update; a fork's PR builds without the .sig.
      - run: node packaging/linux/build.mjs --arch ${{ matrix.arch }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: "install.sh as root: the user piomio, its service answers, uninstall keeps the data"
        run: |
          set -eu
          v=$(node -p "require('./package.json').version")
          sudo env PIOMIO_ARCHIVE="$PWD/dist/linux/piomio-$v-linux-${{ matrix.arch }}.tar.gz" sh packaging/linux/install.sh
          curl -fsS http://127.0.0.1:8080/api/auth/state | tee state.json
          grep -q '"hasPassword":false' state.json
          grep -q "\"version\":\"$v\"" state.json
          test "$(ps -o user= -p "$(pgrep -f 'piomio/current/packaging/linux/start.mjs' | head -n 1)")" = piomio
          sudo -iu piomio piomio version | grep -qx "$v"
          sudo -iu piomio piomio uninstall
          if curl -fsS http://127.0.0.1:8080/api/auth/state; then echo "the hub still answers"; exit 1; fi
          sudo test -f /home/piomio/.local/share/piomio/piomio.db
          sudo test ! -e /home/piomio/.local/lib/piomio
          echo ok
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.arch }}-installer
          path: |
            dist/linux/piomio-*-linux-*.tar.gz
            dist/linux/piomio-*-linux-*.tar.gz.sha256
            dist/linux/piomio-*-linux-*.tar.gz.sig
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # The project's Developer ID (a .p12 in base64 and its password) signs the app for Gatekeeper, and the Apple ID
      # with an app-specific password notarizes it (packaging/macos/sign.mjs). A fork's PR has neither and builds ad hoc.
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      NOTARIZED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The hub's Tailscale node (packages/tailnet) is Go; staging builds it for the installer's architectures.
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tailnet/go.mod
          cache-dependency-path: packages/tailnet/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - run: npm ci
      - run: npm run build:ui -w @piomio/desktop
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml
      # A keychain of the run's own holds the Developer ID; the build finds it by APPLE_SIGNING_IDENTITY, and the team
      # in its name is the notary's APPLE_TEAM_ID. A "Developer ID Installer" identity in the same .p12 signs the .pkg.
      - name: The Developer ID, in a keychain of its own
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          id=$(security find-identity -v -p codesigning "$kc" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -n 1)
          if [ -z "$id" ]; then echo "no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; fi
          echo "APPLE_SIGNING_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$(printf '%s' "$id" | sed -nE 's/.*\(([A-Z0-9]+)\)$/\1/p')" >> "$GITHUB_ENV"
          installer=$(security find-identity -v "$kc" | sed -nE 's/.*"(Developer ID Installer: [^"]+)".*/\1/p' | head -n 1)
          if [ -n "$installer" ]; then echo "APPLE_INSTALLER_IDENTITY=$installer" >> "$GITHUB_ENV"; fi
          echo "signing as $id${installer:+, packages as $installer}"
      # The update files are signed with the project's key; without the secret (a fork's PR) they are left out.
      - run: npm run package:desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      - name: "Developer ID: signed, notarized, stapled"
        if: env.SIGNED == 'true'
        run: |
          set -eu
          dmg=$(ls dist/desktop/piomio-*.dmg | head -n 1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/signed-image "$dmg"
          app=/tmp/signed-image/Piomio.app
          codesign --verify --strict --deep "$app"
          codesign -dv "$app" 2>&1 | grep -q "TeamIdentifier=$APPLE_TEAM_ID"
          codesign -dv "$app" 2>&1 | grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime'
          for arch in arm64 x64; do
            codesign -dv "$app/Contents/Resources/app/packages/tailnet/bin/darwin-$arch/piomio-tailnet" 2>&1 | grep -q "TeamIdentifier=$APPLE_TEAM_ID"
          done
          codesign -dv "$dmg" 2>&1 | grep -q "TeamIdentifier=$APPLE_TEAM_ID"
          if [ "$NOTARIZED" = true ]; then
            xcrun stapler validate "$dmg"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
            for update in dist/desktop/piomio-*-mac.app.tar.gz; do
              [ -f "$update" ] || continue
              mkdir -p "$RUNNER_TEMP/update" && tar -xzf "$update" -C "$RUNNER_TEMP/update"
              xcrun stapler validate "$RUNNER_TEMP/update/Piomio.app"
            done
          fi
          hdiutil detach /tmp/signed-image
          if [ -n "${APPLE_INSTALLER_IDENTITY:-}" ]; then
            pkg=$(ls dist/desktop/piomio-*.pkg | head -n 1)
            pkgutil --check-signature "$pkg"
            if [ "$NOTARIZED" = true ]; then xcrun stapler validate "$pkg"; spctl --assess --type install -vv "$pkg"; fi
          fi
          echo ok
      - name: "Disk image: drag to Applications, run, quit"
        run: |
          set -eu
          data="$HOME/Library/Application Support/Piomio"
          up() { curl -fsS http://127.0.0.1:41780/api/auth/state >state.json 2>/dev/null; }
          down() { ! up; }
          wait_for() { i=0; until "$@"; do i=$((i + 1)); if [ "$i" -ge 120 ]; then echo "timed out: $*"; cat "$data/logs/"*.log || true; exit 1; fi; sleep 1; done; }

          dmg=$(ls dist/desktop/piomio-*.dmg | head -n 1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/owl-image "$dmg"
          test "$(readlink /tmp/owl-image/Applications)" = /Applications
          codesign --verify --strict /tmp/owl-image/Piomio.app
          codesign -dv /tmp/owl-image/Piomio.app/Contents/Resources/app/runtime/arm64/bin/node 2>&1 | grep -q "TeamIdentifier=HX7739G8FX"
          lipo -archs /tmp/owl-image/Piomio.app/Contents/MacOS/Piomio | grep -q x86_64
          ditto /tmp/owl-image/Piomio.app /Applications/Piomio.app
          hdiutil detach /tmp/owl-image

          /Applications/Piomio.app/Contents/MacOS/Piomio --mode hub --background &
          wait_for up
          grep -q '"hasPassword":false' state.json
          node /Applications/Piomio.app/Contents/Resources/app/packaging/desktop/launch.mjs url | grep -Eq '^http://localhost:41780/#setup=[A-Za-z0-9_-]+$'
          grep -q "/Applications/Piomio.app/Contents/MacOS/Piomio" "$HOME/Library/LaunchAgents/ai.piomio.app.plist"

          /Applications/Piomio.app/Contents/MacOS/Piomio --quit
          wait_for down
          test -f "$data/piomio.db"
          # The package check starts from a first run again (the data stays).
          rm -rf /Applications/Piomio.app "$HOME/Library/Application Support/ai.piomio.app" "$HOME/Library/LaunchAgents/ai.piomio.app.plist"
          echo ok
      - name: "Package: silent install, run, uninstall"
        run: |
          set -eu
          data="$HOME/Library/Application Support/Piomio"
          up() { curl -fsS http://127.0.0.1:41780/api/auth/state >state.json 2>/dev/null; }
          down() { ! up; }
          wait_for() { i=0; until "$@"; do i=$((i + 1)); if [ "$i" -ge 120 ]; then echo "timed out: $*"; cat "$data/logs/"*.log || true; exit 1; fi; sleep 1; done; }

          pkg=$(ls dist/desktop/piomio-*.pkg | head -n 1)
          pkgutil --payload-files "$pkg" | grep -q "Applications/Piomio.app/Contents/Resources/uninstall.sh"
          sudo installer -pkg "$pkg" -target /
          test -x /Applications/Piomio.app/Contents/MacOS/Piomio
          # The postinstall opened the app at its first run; this makes the choice through it (or starts it).
          /Applications/Piomio.app/Contents/MacOS/Piomio --mode hub --background &
          wait_for up

          sudo /bin/sh /Applications/Piomio.app/Contents/Resources/uninstall.sh "$(id -u)" "$HOME"
          wait_for down
          test ! -e /Applications/Piomio.app
          test ! -e "$HOME/Library/LaunchAgents/ai.piomio.app.plist"
          if pkgutil --pkg-info ai.piomio.pkg >/dev/null 2>&1; then echo "the package receipt is still there"; exit 1; fi
          test -f "$data/piomio.db"
          echo ok
      - name: Drop the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installers
          path: |
            dist/desktop/piomio-*.dmg
            dist/desktop/piomio-*.pkg
            dist/desktop/piomio-*-mac.app.tar.gz
            dist/desktop/piomio-*-mac.app.tar.gz.sig
          if-no-files-found: ignore
