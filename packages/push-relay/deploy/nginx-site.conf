# The Piomio push relay at relay.piomio.io: /etc/nginx/sites-enabled/piomio-push-relay, TLS added by
# `certbot --nginx -d relay.piomio.io`. relay.mjs listens on 127.0.0.1:8795 (systemd: piomio-push-relay.service). The
# relay rate-limits by the client's address, which it takes from X-Forwarded-For: set here, never passed on from the
# client.
server {
    listen 80;
    listen [::]:80;
    server_name relay.piomio.io;

    location / {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        access_log off;
        add_header X-Robots-Tag "noindex" always;
    }
}
