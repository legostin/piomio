[package]
name = "piomio"
version = "0.1.0"
description = "Piomio desktop app"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
getrandom = "0.3"
base64 = "0.22"
dunce = "1"
# Pio's bubble (pio/): the mouse and keyboard, captures as JPEG.
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Pio on macOS: windows, displays, the cursor and the permissions from the system's own frameworks.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGWindow"] }

[target.'cfg(windows)'.dependencies]
win32job = "2"
winreg = "0.56"
# Pio on Windows: windows and captures; the cursor anywhere on the desktop.
xcap = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
